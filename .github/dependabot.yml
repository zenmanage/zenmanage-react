# Keeps the npm dependencies and the GitHub Actions used by the workflows up to date.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # CI still tests Node 18 and 20. Vitest 3 is the newest line that supports both
    # (vitest 4 needs Node 20+, vitest 5 needs Node 22+), so stay on it until those
    # Node versions are dropped from the test matrix.
    ignore:
      - dependency-name: 'vitest'
        versions: ['>=4.0.0']
      - dependency-name: '@vitest/*'
        versions: ['>=4.0.0']
      # jsdom 27+ needs Node 20.19+ (30 needs Node 22.22+); 26.1.0 is the newest that
      # still runs on Node 18. Same reason as vitest above.
      - dependency-name: 'jsdom'
        versions: ['>=27.0.0']
      # ESLint 10 needs Node 20.19+, so ESLint 9 (flat config, Node 18.18+) is the newest line
      # that runs on the Node 18 job. Stay on it until Node 18 is dropped from the test matrix.
      - dependency-name: 'eslint'
        versions: ['>=10.0.0']

  # The smoke app runs the built package on React 18, the oldest version this package
  # supports. It still gets every other update, security fixes included. Only major React
  # bumps are ignored, since Dependabot would otherwise keep proposing React 19 here.
  - package-ecosystem: 'npm'
    directory: '/examples/smoke-app'
    schedule:
      interval: 'weekly'
    ignore:
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
