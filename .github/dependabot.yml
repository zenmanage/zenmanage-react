# Keeps the npm dependencies and the GitHub Actions used by the workflows up to date.
# examples/smoke-app is left out on purpose: it pins React 18, the oldest version this
# package supports, and Dependabot would keep proposing React 19 there.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
